#@TYPE: Machine
#@NAME: stm32mp1-efi
#@DESCRIPTION: Configuration example for all STM32MP1 boards (EV, DK, ...) with EFI support
#@NEEDED_BSPLAYERS: layers/meta-openembedded/meta-oe layers/meta-openembedded/meta-python

include stm32mp1.conf

# =========================================================================
# boot device
# =========================================================================
# Define the boot device supported
BOOTDEVICE_LABELS = "emmc"
BOOTDEVICE_LABELS += "sdcard"

# =========================================================================
# EFI
# =========================================================================
# activate EFI feature
MACHINE_FEATURES += "efi"
# force to use a specific tsv prefix name
FLASHLAYOUT_BASENAME = "FlashLayout-EFI"

# KERNEL: MUST set the load address to 0
ST_KERNEL_LOADADDR = "0x0"
ST_KERNEL_LOADADDR:stm32mp1common ?= "0x0"


# Override default config to use 'vfat' fstype for bootfs partition
PARTITIONS_CONFIG[emmc] = "\
    ${@' '.join(['%s' % partImage2partConfig(d, config, 'emmc', 'vfat' if config == 'bootfs' else '${PARTITIONS_SUFFIX}') for config in d.getVar('PARTITIONS_IMAGES').split()])} \
    "
PARTITIONS_CONFIG[sdcard] = "\
    ${@' '.join(['%s' % partImage2partConfig(d, config, 'sdcard', 'vfat' if config == 'bootfs' else '${PARTITIONS_SUFFIX}') for config in d.getVar('PARTITIONS_IMAGES').split()])} \
    "
